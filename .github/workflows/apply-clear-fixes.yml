name: Apply CLEAR remediation

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-clear-fixes.mjs
      - .github/workflows/apply-clear-fixes.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: clear-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source remediation
        run: node scripts/apply-clear-fixes.mjs

      - name: Apply non-breaking dependency remediation
        run: npm audit fix || true

      - name: Install current patched React Router release
        run: npm install react-router-dom@latest --save-exact

      - name: Capture dependency audit
        run: |
          npm audit --json > dependency-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'))
          const counts = report.metadata?.vulnerabilities ?? {}
          const findings = Object.values(report.vulnerabilities ?? {})
            .filter((item) => ['high', 'critical'].includes(item.severity))
            .sort((a, b) => a.name.localeCompare(b.name))
          const lines = [
            '# Dependency audit',
            '',
            `Generated: ${new Date().toISOString()}`,
            '',
            'The repository applied `npm audit fix` without `--force`, installed the current patched React Router release, then reran the audit. Publication is blocked by any high-severity production dependency or any critical finding in the full dependency tree.',
            '',
            '## Summary after remediation',
            '',
            `- Critical: ${counts.critical ?? 0}`,
            `- High: ${counts.high ?? 0}`,
            `- Moderate: ${counts.moderate ?? 0}`,
            `- Low: ${counts.low ?? 0}`,
            `- Total: ${counts.total ?? 0}`,
            '',
            '## Remaining high or critical findings',
            '',
          ]
          if (!findings.length) {
            lines.push('None.')
          } else {
            for (const item of findings) {
              const via = (item.via ?? []).map((entry) => typeof entry === 'string' ? entry : `${entry.title ?? entry.name ?? 'advisory'} (${entry.url ?? 'no URL'})`).join('; ')
              lines.push(`### ${item.name}`)
              lines.push('')
              lines.push(`- Severity: ${item.severity}`)
              lines.push(`- Direct dependency: ${item.isDirect ? 'yes' : 'no'}`)
              lines.push(`- Affected range: ${item.range ?? 'not reported'}`)
              lines.push(`- Fix available: ${JSON.stringify(item.fixAvailable)}`)
              lines.push(`- Via: ${via || 'not reported'}`)
              lines.push('')
            }
          }
          lines.push('## Enforcement policy', '', '- Production dependencies: fail on high or critical findings.', '- Full dependency tree: fail on critical findings.', '- High-severity development-only findings may remain temporarily only when a non-breaking fix is unavailable; they must stay documented here and be revisited during dependency upgrades.', '')
          fs.writeFileSync('docs/DEPENDENCY_AUDIT.md', lines.join('\n'))
          NODE
          rm dependency-audit.json

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree for critical findings
        run: npm audit --audit-level=critical

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Remove one-time remediation machinery
        run: rm scripts/apply-clear-fixes.mjs .github/workflows/apply-clear-fixes.yml

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement CLEAR review fixes"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: remediate
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
